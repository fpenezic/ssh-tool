# Release pipeline for ssh-tool (port of the pre-OSS GitLab CI).
#
# Trigger: annotated semver tags. Plain tags (v0.45.2) run
# test -> build x4 + android -> publish (GitHub Release; sshtool.app
# mirrors it within ~10 minutes and redirects downloads to the
# release assets). Suffixed tags (-test, -rcN) land as a GitHub
# *prerelease* only and are never offered as updates.
#
# Differences from the GitLab pipeline:
# - No custom CI image: hosted runners apt-get the GTK/WebKit deps
#   per job (~1 min) and setup-go/setup-node handle tool caches.
# - linux-arm64 builds natively on the ubuntu-24.04-arm hosted
#   runner (observed working on this repo while still private).
# - Pre-release artifacts go to a GitHub prerelease instead of the
#   GitLab Generic Package Registry.
#
# Secrets: ANDROID_DEBUG_KEYSTORE (APK signing, see build-android).

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # gh release create

env:
  WAILS3_VERSION: v3.0.0-beta.18
  # Pinned, not @latest: task 3.53.1 raised its own Go requirement to 1.25.10
  # overnight and broke every build job on a green tag. A pin means our builds
  # only change when we change them.
  TASK_VERSION: v3.53.1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so `git describe` stamps the version.
          fetch-depth: 0
      - name: Install Wails v3 Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The root `main` package embeds frontend/dist (//go:embed), so the
      # frontend has to be built before `go test .` can compile - hence
      # the frontend build up front (which also feeds npm run check).
      - name: Frontend build + svelte-check
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run check
      # go vet is intentionally NOT a gate here: it currently flags some
      # pre-existing %s:%d-vs-IPv6 formatting in the ssh layer that's a
      # separate cleanup. The real gates are the test suite + svelte-check.
      # Scope: ./internal/... + root main - build/{android,ios} scaffold
      # packages don't compile without the NDK/Xcode.
      - name: Go tests
        run: go test ./internal/... .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            build: task linux:build
            bin: bin/ssh-tool
            out: ssh-tool-linux-amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            build: task linux:build
            bin: bin/ssh-tool
            out: ssh-tool-linux-arm64
          # Windows targets cross-compile from linux with CGO_ENABLED=0.
          # Wails v3 on Windows talks to WebView2 via a system DLL - no
          # C compiler dep at build time, so no GTK deps either.
          - platform: windows-amd64
            runner: ubuntu-24.04
            build: CGO_ENABLED=0 task windows:build
            bin: bin/ssh-tool.exe
            out: ssh-tool-windows-amd64.exe
          - platform: windows-arm64
            runner: ubuntu-24.04
            build: CGO_ENABLED=0 task windows:build ARCH=arm64
            bin: bin/ssh-tool.exe
            out: ssh-tool-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Needed on the windows cross legs too: `go install wails3`
      # links the CLI against the full wails runtime, which needs the
      # GTK/WebKit shared libs even though the windows build itself
      # is CGO_ENABLED=0.
      - name: Install Wails v3 Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install task + wails3 CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS3_VERSION}
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build
        # SSHTOOL_VERSION pins the stamped version to the EXACT tag that
        # triggered this run. `git describe` is ambiguous when a commit
        # has more than one tag (a leftover -rcN next to the release
        # tag) and picked the wrong one in v0.48.0. The Taskfiles prefer
        # this env when set.
        env:
          SSHTOOL_VERSION: ${{ github.ref_name }}
        run: |
          ${{ matrix.build }}
      # Distro packages. All three were installed, verified and removed on
      # real systems before this step was added (Fedora 44 for the rpm,
      # Ubuntu 24.04 for the deb, CachyOS for the pacman one) - see
      # docs/TODO.md. That install is what found the two defects the
      # config alone did not show: nfpm stamping the build machine's
      # hostname into the RPM header, and a desktop entry with two main
      # categories.
      #
      # nfpm names its output ssh-tool.<ext> with no version or
      # architecture, which is fine in bin/ and wrong on a release page
      # where someone downloads the file on its own. Renamed here rather
      # than in the Taskfile so local builds keep the short names.
      #
      # amd64 only: the packages hard-code an amd64 binary path, and
      # cross-building them would need the arm64 binary staged into the
      # same tree. Worth doing when an arm64 Linux user asks.
      - name: Build distro packages
        if: matrix.platform == 'linux-amd64'
        env:
          SSHTOOL_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          task linux:create:deb
          task linux:create:rpm
          task linux:create:aur
          ver="${GITHUB_REF_NAME#v}"
          mv bin/ssh-tool.deb          "bin/ssh-tool_${ver}_amd64.deb"
          mv bin/ssh-tool.rpm          "bin/ssh-tool-${ver}.x86_64.rpm"
          mv bin/ssh-tool.pkg.tar.zst  "bin/ssh-tool-${ver}-x86_64.pkg.tar.zst"
          ls -la bin/

      # The helper scripts do ship: they are what the release page points
      # at for a manual install.
      - name: Attach install helpers
        if: matrix.platform == 'linux-amd64'
        run: cp build/linux/install-user.sh build/linux/check-deps.sh build/appicon.png build/appicon.svg bin/
      - name: Rename binary
        run: mv ${{ matrix.bin }} bin/${{ matrix.out }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: bin/${{ matrix.out }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux-amd64'
        with:
          name: linux-install-helpers
          path: |
            bin/*.sh
            bin/appicon.*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux-amd64'
        with:
          name: linux-distro-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  # Android APK. Built on the hosted runner (SDK preinstalled, NDK
  # added via sdkmanager) and signed with the same keystore local
  # builds used (ANDROID_DEBUG_KEYSTORE secret, base64) - a different
  # signing identity would make existing installs refuse the upgrade.
  # Clean version stamp per the bindings-regen gotcha: full
  # android:package once, restore the desktop bindings, then a
  # gradle-only re-assemble with the version passed explicitly.
  build-android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Wails v3 Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install NDK r26d
        run: echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" >/dev/null
      - name: Install task + wails3 CLI
        run: |
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS3_VERSION}
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE secret not set - APK would get a throwaway signature and existing installs would refuse to upgrade"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          # Explicit path consumed by the signingConfig in build.gradle;
          # the AGP default (.android dir) is relocated on hosted runners
          # and silently falls back to a fresh throwaway key.
          echo "SSHTOOL_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build APK
        env:
          SSHTOOL_VERSION: ${{ github.ref_name }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.3.11579264"
          task android:package
          # The mid-build bindings regen dirties the tree and taints the
          # gradle version stamp; restore and re-assemble clean with the
          # version derived from the tag.
          git checkout -- frontend/bindings/
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          base="${ver%%-*}"
          IFS=. read -r MA MI PA <<< "$base"
          code=$((MA * 100000 + MI * 1000 + PA))
          (cd build/android && ./gradlew assembleDebug -PversionName="$ver" -PversionCode="$code")
          mkdir -p bin
          cp build/android/app/build/outputs/apk/debug/app-debug.apk bin/ssh-tool-android-arm64.apk
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          got=$("$APKSIGNER" verify --print-certs bin/ssh-tool-android-arm64.apk \
            | grep -oE 'SHA-256 digest: [a-f0-9]+' | head -1 | awk '{print $3}')
          exp="b2ca1fafc2e6fedbd9df84085ea0adb58d126263b2b43087f2bbba07f3b63349"
          if [ "$got" != "$exp" ]; then
            echo "::error::APK signed with the wrong key ($got) - existing installs would refuse this upgrade"
            exit 1
          fi
          echo "signature OK ($got)"
      - uses: actions/upload-artifact@v7
        with:
          name: ssh-tool-android-arm64.apk
          path: bin/ssh-tool-android-arm64.apk
          if-no-files-found: error
          retention-days: 7

  # Sidecar tunnel helpers are NOT built here anymore. They ship on
  # their own "helper-vN" tag via .github/workflows/helper-release.yml,
  # decoupled from the app version. The app downloads the newest
  # compatible helper release at runtime (app_plugins.go). See
  # docs/helper-release-plan.md.

  # Full release: plain semver tags only. Creates the GitHub Release;
  # sshtool.app mirrors it (metadata sync + download redirect), which
  # is how pre-0.45 installs polling only sshtool.app still see it.
  publish:
    needs: [build, build-android]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # Release notes = this tag's CHANGELOG block (between its
          # heading and the next "## [" heading). CHANGELOG headings
          # carry no "v" prefix ("## [0.44.0] - ..."), so match both
          # forms. Fall back to auto-generated notes when missing.
          ver="${tag#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[v?" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/notes.md
          # Idempotent: a re-run (or a re-triggered tag) uploads assets
          # into the existing release instead of failing on create.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" bin/* --clobber
          elif [ -s /tmp/notes.md ]; then
            gh release create "$tag" bin/* --title "$tag" --notes-file /tmp/notes.md
          else
            gh release create "$tag" bin/* --title "$tag" --generate-notes
          fi

  # Push the refreshed recipe to the AUR, so `yay -S ssh-tool-bin` tracks
  # releases without a manual step.
  #
  # Runs after publish on purpose: aur-release.sh hashes the PUBLISHED
  # artefacts, so there is nothing to checksum until the release exists.
  #
  # Skipped silently when AUR_SSH_KEY is not configured. The initial
  # import cannot happen here anyway - the AUR repo does not exist until
  # a maintainer pushes it the first time, and that push needs their
  # account. See docs/TODO.md for the one-time steps.
  aur:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check for the AUR key
        id: gate
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY not set - skipping the AUR push." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh the recipe for this tag
        if: steps.gate.outputs.enabled == 'true'
        run: ./scripts/aur-release.sh "${{ github.ref_name }}"

      - name: Push to the AUR
        if: steps.gate.outputs.enabled == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pin the host key rather than disabling verification: this is
          # a push with a write-capable key, so an unauthenticated host
          # is not acceptable even in CI.
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'SSHCFG'
          Host aur.archlinux.org
              User aur
              IdentityFile ~/.ssh/aur
              IdentitiesOnly yes
          SSHCFG
          chmod 600 ~/.ssh/config

          git clone ssh://aur@aur.archlinux.org/ssh-tool-bin.git /tmp/aur
          cp build/aur/PKGBUILD /tmp/aur/PKGBUILD
          cd /tmp/aur

          # .SRCINFO must agree with the PKGBUILD or the AUR rejects the
          # push, and only makepkg can generate it. It is not packaged for
          # Ubuntu, and pacman's repo ships scripts/makepkg.sh.IN - a
          # meson template, not a runnable script - so building it from
          # source is more work than borrowing an Arch image for the one
          # command. makepkg refuses to run as root, and the image's
          # `nobody` account is expired ("su: User account has expired"),
          # so make a throwaway user. --printsrcinfo only parses the
          # recipe - nothing is downloaded or compiled here.
          docker run --rm -v /tmp/aur:/pkg -w /pkg archlinux:base-devel \
            sh -c 'useradd -m builder && chown -R builder /pkg && su builder -c "makepkg --printsrcinfo"' \
            > .SRCINFO
          test -s .SRCINFO

          git config user.name "Filip Penezic"
          git config user.email "108677346+fpenezic@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          # A re-run of the same tag has nothing to commit; that is a
          # success, not a failure.
          if git diff --cached --quiet; then
            echo "AUR already at ${TAG#v}; nothing to push."
            exit 0
          fi
          git commit -m "${TAG#v}"
          git push origin master

      # The recipe in THIS repo is the source of truth for the next run,
      # so commit the refreshed pkgver/checksums back to main. Without
      # this the repo keeps showing the previous version while the AUR
      # has moved on, and the next aur-release.sh starts from stale
      # numbers.
      - name: Commit the refreshed recipe back to main
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- build/aur/PKGBUILD; then
            echo "recipe already current in the repo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/aur/PKGBUILD
          git commit -m "chore(aur): recipe for ${TAG}"
          # The tag is not on a branch here (checkout is detached), so
          # push explicitly to main. A release is always tagged from main.
          git push origin HEAD:main

  # Pre-release tags (vX.Y.Z-suffix): artifacts land as a GitHub
  # prerelease for testers; sshtool.app is never touched.
  prerelease:
    needs: [build, build-android]
    if: ${{ contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true
      - name: GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" bin/* --clobber
          else
            gh release create "$tag" bin/* --title "$tag" --prerelease \
              --notes "Pre-release build for testing. Not published to sshtool.app."
          fi

  # Build the apt + dnf repository and publish it to GitHub Pages, so
  # `apt upgrade` / `dnf upgrade` carry new versions the way the AUR
  # already does for Arch.
  #
  # Gated on REPO_GPG_KEY, and silently does nothing until it is set.
  # That gate is not only about the key: the .deb and .rpm have never
  # been installed on a Debian or Fedora machine (see docs/TODO.md), and
  # a repository that serves an untested package is worse than no
  # repository - it installs that package on every user automatically,
  # rather than one person trying it by hand. Set the secret once the
  # packages have actually been installed somewhere.
  #
  # Runs after publish because it reuses the published artefacts: the
  # binaries in the packages should be the exact bytes users download,
  # not a second build of the same tag.
  repo:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check for the signing key
        id: gate
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            echo "REPO_GPG_KEY not set - skipping the apt/dnf repository." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg

      # The packages come from the build job rather than being rebuilt
      # here, so the repository serves the EXACT bytes attached to the
      # release. Rebuilding would also need the whole Go/Node/GTK
      # toolchain for a second time, and a Linux build needs CGO for the
      # GTK bindings - a CGO_ENABLED=0 rebuild does not even compile.
      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: linux-distro-packages
          path: bin

      - name: Collect the previous versions
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkgs
          cp bin/*.deb bin/*.rpm /tmp/pkgs/ 2>/dev/null || true

          # Retention: this tag plus the four before it stay resolvable,
          # so `apt install ssh-tool=<older>` keeps working for a while
          # without the repo growing without bound. Older packages simply
          # stop being listed; the GitHub Release still has them.
          gh release list --limit 40 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' \
            | grep -v "^${TAG}$" | head -n 4 > /tmp/keep.txt || true

          while read -r old; do
            [ -n "$old" ] || continue
            # A tag from before the packages shipped has none to download;
            # that is expected, not an error.
            gh release download "$old" --dir /tmp/pkgs \
              --pattern '*.deb' --pattern '*.rpm' 2>/dev/null \
              || echo "no packages on $old - skipping" >&2
          done < /tmp/keep.txt

          ls -la /tmp/pkgs

      - name: Import the signing key
        if: steps.gate.outputs.enabled == 'true'
        id: gpg
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [ -z "$keyid" ]; then
            echo "no secret key found after import" >&2
            exit 1
          fi
          echo "keyid=$keyid" >> "$GITHUB_OUTPUT"

      - name: Build the repository
        if: steps.gate.outputs.enabled == 'true'
        run: ./scripts/build-repo.sh /tmp/pkgs /tmp/repo "${{ steps.gpg.outputs.keyid }}"

      - name: Publish to GitHub Pages
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The repo tree replaces the branch wholesale rather than being
          # merged into it: apt and dnf metadata describe exactly the set
          # of files present, so a leftover package from a previous run
          # would be listed by nothing and served forever.
          rm -rf /tmp/pages
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/pages 2>/dev/null || {
              git init /tmp/pages
              git -C /tmp/pages checkout -b gh-pages
              git -C /tmp/pages remote add origin \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            }

          # The identity has to be set on /tmp/pages, not on the checkout:
          # `git config` without --global writes to the repository it is run
          # in, and the commit below happens in the clone. Setting it on the
          # checkout left the clone with no identity at all.
          git -C /tmp/pages config user.name "github-actions[bot]"
          git -C /tmp/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find /tmp/pages -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r /tmp/repo/. /tmp/pages/
          # Jekyll would eat the dists/ directory's underscore-free but
          # metadata-only files; .nojekyll turns that processing off.
          touch /tmp/pages/.nojekyll
          # REPO_URL is a placeholder in the checked-in page: the real
          # host is only known here, and hard-coding it in docs/ would
          # rot the moment the repo moves or gains a CNAME.
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY##*/}"
          url="${owner}.github.io/${name}"
          sed "s|REPO_URL|${url}|g" "${GITHUB_WORKSPACE}/docs/repo-index.html" \
            > /tmp/pages/index.html

          cd /tmp/pages
          git add -A
          if git diff --cached --quiet; then
            echo "repository unchanged - nothing to publish"
            exit 0
          fi
          git commit -m "repo: ${TAG}"
          git push origin gh-pages

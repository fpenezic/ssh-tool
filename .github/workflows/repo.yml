# The apt + dnf repository on GitHub Pages (gh-pages), built from published
# GitHub Releases only - the exact bytes users download:
#   - the last 5 stable ssh-tool releases;
#   - when the repository variable CATALOG_RELEASES_REPO is set, the last 5
#     stable ssh-tool-catalog releases from that public releases repository,
#     each one only after its SHA256SUMS passes a keyless cosign check
#     against CATALOG_SIGNER and the packages match it.
#
# The tree replaces gh-pages wholesale (apt and dnf metadata describe
# exactly the files present), so every run collects both products: a run
# for one of them keeps the other's packages.
#
# Triggers: after an ssh-tool release (workflow_call from release.yml), a
# catalog release (repository_dispatch "catalog-release" from the catalog's
# tag pipeline), and by hand.
#
# Variables: CATALOG_RELEASES_REPO (owner/name; unset = app packages only,
# the gate until the catalog packages were installed on a real Debian /
# Ubuntu and Fedora), CATALOG_SIGNER (certificate identity regexp of the
# catalog's signing pipeline), PAGES_DOMAIN. Secret: REPO_GPG_KEY.

name: repo

on:
  workflow_call:
    secrets:
      REPO_GPG_KEY:
        required: false
  repository_dispatch:
    types: [catalog-release]
  workflow_dispatch:

# One rebuild at a time: an app release and a catalog release close
# together must not race on the gh-pages push.
concurrency:
  group: pages-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check for the signing key
        id: gate
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            echo "REPO_GPG_KEY not set - skipping the apt/dnf repository." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packaging tools
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg rpm

      # Optional for the app: a failed install only means the catalog's
      # packages are carried over from the current gh-pages below.
      - name: Install cosign
        id: cosign
        if: steps.gate.outputs.enabled == 'true' && vars.CATALOG_RELEASES_REPO != ''
        continue-on-error: true
        # Pinned by commit: a third-party action in a job that can push gh-pages.
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      # The app's packages: the release this run follows is published by
      # the time it runs (the publish job creates it, not as a draft), so
      # its assets are the same bytes the build job made. The newest five
      # stay resolvable (`apt install ssh-tool=<older>`); older ones stop
      # being listed, their GitHub Releases still have them.
      #
      # Any failed request (after retries), a newest release without
      # packages, or a release whose download comes back short stops the
      # job: gh-pages then keeps what it has instead of losing a version.
      - name: Collect the app packages
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() { local n=0; until "$@"; do n=$((n + 1)); [ "$n" -ge 3 ] && return 1; sleep $((n * 5)); done; }
          mkdir -p /tmp/pkgs
          retry gh release list -R "$GITHUB_REPOSITORY" --limit 40 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' > /tmp/app-all.txt
          head -n 5 /tmp/app-all.txt > /tmp/app-tags.txt
          newest=1
          while read -r tag; do
            [ -n "$tag" ] || continue
            want=$(retry gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name | select(endswith(".deb") or endswith(".rpm"))] | length')
            if [ "$want" -eq 0 ]; then
              if [ "$newest" -eq 1 ]; then
                echo "ssh-tool: the newest release $tag has no packages - not publishing" >&2
                exit 1
              fi
              # A tag from before the packages shipped: expected.
              echo "ssh-tool: no packages on $tag - skipping" >&2
              continue
            fi
            d="/tmp/app/$tag"
            mkdir -p "$d"
            retry gh release download "$tag" -R "$GITHUB_REPOSITORY" --dir "$d" --clobber \
              --pattern '*.deb' --pattern '*.rpm'
            got=$(find "$d" -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) | wc -l)
            if [ "$got" -ne "$want" ]; then
              echo "ssh-tool: $tag gave $got of $want packages - not publishing" >&2
              exit 1
            fi
            cp "$d"/*.deb "$d"/*.rpm /tmp/pkgs/ 2>/dev/null || true
            newest=0
          done < /tmp/app-tags.txt
          if ! ls /tmp/pkgs/ssh-tool_*.deb >/dev/null 2>&1 || ! ls /tmp/pkgs/ssh-tool-*.rpm >/dev/null 2>&1; then
            echo "no ssh-tool .deb / .rpm collected - not publishing" >&2
            exit 1
          fi
          ls -la /tmp/pkgs

      # The catalog's packages, gated by CATALOG_RELEASES_REPO. Everything
      # collected here is signed with this repository's key below, so a
      # release counts only when its SHA256SUMS carries a valid keyless
      # cosign bundle from the catalog's own tag pipeline (CATALOG_SIGNER,
      # issuer gitlab.com) and the packages match it; a release that fails
      # that is skipped and logged.
      #
      # A failure that says nothing about the packages (cosign could not be
      # installed, a request failed after retries) never drops them: the
      # catalog packages now on gh-pages, verified when they got there, are
      # carried over instead. If even those cannot be read, the job stops
      # and gh-pages stays as it is.
      - name: Collect the catalog packages
        if: steps.gate.outputs.enabled == 'true' && vars.CATALOG_RELEASES_REPO != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_RELEASES_REPO: ${{ vars.CATALOG_RELEASES_REPO }}
          CATALOG_SIGNER: ${{ vars.CATALOG_SIGNER }}
          COSIGN: ${{ steps.cosign.outcome }}
        run: |
          set -euo pipefail
          if [ -z "$CATALOG_SIGNER" ]; then
            echo "CATALOG_SIGNER not set - catalog packages are not collected." >&2
            exit 0
          fi
          retry() { local n=0; until "$@"; do n=$((n + 1)); [ "$n" -ge 3 ] && return 1; sleep $((n * 5)); done; }
          carry=""
          if [ "$COSIGN" != "success" ]; then
            carry="cosign could not be installed"
          elif ! retry cosign initialize >/dev/null 2>&1; then
            # The trust root (TUF) is fetched up front: with it in place, a
            # failing verify-blob below is about the signature, not about
            # reaching sigstore.
            carry="the sigstore trust root could not be fetched"
          elif ! retry gh release list -R "$CATALOG_RELEASES_REPO" --limit 40 --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '.[].tagName' > /tmp/cat-all.txt; then
            carry="the release list could not be read"
          else
            head -n 5 /tmp/cat-all.txt > /tmp/cat-tags.txt
            mkdir -p /tmp/catpkgs
            while read -r tag; do
              [ -n "$tag" ] || continue
              d="/tmp/cat/$tag"
              mkdir -p "$d"
              if ! retry gh release download "$tag" -R "$CATALOG_RELEASES_REPO" --dir "$d" --clobber \
                  --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sigstore.json' \
                  --pattern '*.deb' --pattern '*.rpm'; then
                carry="$tag could not be downloaded"
                break
              fi
              if ! (cd "$d" && cosign verify-blob \
                    --bundle SHA256SUMS.sigstore.json \
                    --certificate-oidc-issuer https://gitlab.com \
                    --certificate-identity-regexp "$CATALOG_SIGNER" SHA256SUMS >/dev/null 2>&1); then
                echo "ssh-tool-catalog: $tag SHA256SUMS signature did not verify - skipping" >&2
                continue
              fi
              if ! (cd "$d" && sha256sum -c --ignore-missing --strict SHA256SUMS); then
                echo "ssh-tool-catalog: $tag packages do not match SHA256SUMS - skipping" >&2
                continue
              fi
              # Only packages SHA256SUMS lists (a file it does not name was
              # not covered by the signature).
              awk '{ n = $2; sub(/^\*/, "", n); sub(/^\.\//, "", n); print n }' "$d/SHA256SUMS" > "$d/.listed"
              for f in "$d"/*.deb "$d"/*.rpm; do
                [ -e "$f" ] || continue
                if grep -qxF "$(basename "$f")" "$d/.listed"; then
                  cp "$f" /tmp/catpkgs/
                else
                  echo "ssh-tool-catalog: $tag $(basename "$f") is not in SHA256SUMS - left out" >&2
                fi
              done
            done < /tmp/cat-tags.txt
          fi
          if [ -n "$carry" ]; then
            echo "ssh-tool-catalog: $carry - carrying over the catalog packages now on gh-pages" >&2
            rm -rf /tmp/prev
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/prev
            rm -rf /tmp/catpkgs
            mkdir -p /tmp/catpkgs
            find /tmp/prev/deb/pool /tmp/prev/rpm -maxdepth 2 -type f \
              \( -name 'ssh-tool-catalog_*.deb' -o -name 'ssh-tool-catalog-*.rpm' \) \
              -exec cp {} /tmp/catpkgs/ \; 2>/dev/null || true
          fi
          cp /tmp/catpkgs/* /tmp/pkgs/ 2>/dev/null || true
          ls -la /tmp/pkgs

      - name: Import the signing key
        if: steps.gate.outputs.enabled == 'true'
        id: gpg
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [ -z "$keyid" ]; then
            echo "no secret key found after import" >&2
            exit 1
          fi
          echo "keyid=$keyid" >> "$GITHUB_OUTPUT"

      - name: Build the repository
        if: steps.gate.outputs.enabled == 'true'
        run: ./scripts/build-repo.sh /tmp/pkgs /tmp/repo "${{ steps.gpg.outputs.keyid }}"

      - name: Publish to GitHub Pages
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          # What the commit says triggered it. The dispatch tag comes from
          # outside: only a plain version-like value is used.
          case "$EVENT" in
            repository_dispatch)
              if printf '%s' "$DISPATCH_TAG" | grep -qE '^[A-Za-z0-9._-]{1,64}$'; then
                why="catalog ${DISPATCH_TAG}"
              else
                why="catalog release"
              fi ;;
            workflow_dispatch) why="manual rebuild" ;;
            *) why="$REF" ;;
          esac

          # The repo tree replaces the branch wholesale rather than being
          # merged into it: apt and dnf metadata describe exactly the set
          # of files present, so a leftover package from a previous run
          # would be listed by nothing and served forever.
          rm -rf /tmp/pages
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/pages 2>/dev/null || {
              git init /tmp/pages
              git -C /tmp/pages checkout -b gh-pages
              git -C /tmp/pages remote add origin \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            }

          # The identity has to be set on /tmp/pages, not on the checkout:
          # `git config` without --global writes to the repository it is run
          # in, and the commit below happens in the clone.
          git -C /tmp/pages config user.name "github-actions[bot]"
          git -C /tmp/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find /tmp/pages -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r /tmp/repo/. /tmp/pages/
          # Jekyll processing off (it would eat metadata-only files).
          touch /tmp/pages/.nojekyll
          # CNAME is what makes Pages answer on the custom domain, and the
          # wipe above deletes it: written here from PAGES_DOMAIN so the
          # domain survives every publish. The page's REPO_URL placeholder
          # takes the custom domain when set, the github.io URL otherwise.
          if [ -n "${PAGES_DOMAIN}" ]; then
            printf '%s\n' "${PAGES_DOMAIN}" > /tmp/pages/CNAME
            url="${PAGES_DOMAIN}"
          else
            owner="${GITHUB_REPOSITORY%%/*}"
            name="${GITHUB_REPOSITORY##*/}"
            url="${owner}.github.io/${name}"
          fi
          sed "s|REPO_URL|${url}|g" "${GITHUB_WORKSPACE}/docs/repo-index.html" \
            > /tmp/pages/index.html
          # The catalog's install lines only for what the repository
          # holds: apt and dnf each on their own, the section only when
          # either is there (before the gate opens it would point at
          # nothing).
          has_deb=0; has_rpm=0
          ls /tmp/repo/deb/pool/main/ssh-tool-catalog_*.deb >/dev/null 2>&1 && has_deb=1
          ls /tmp/repo/rpm/ssh-tool-catalog-*.rpm >/dev/null 2>&1 && has_rpm=1
          if [ "$has_deb" -eq 0 ] && [ "$has_rpm" -eq 0 ]; then
            sed -i '/<!--CATALOG-->/,/<!--\/CATALOG-->/d' /tmp/pages/index.html
          else
            [ "$has_deb" -eq 1 ] || sed -i '/<!--CATALOG-DEB-->/,/<!--\/CATALOG-DEB-->/d' /tmp/pages/index.html
            [ "$has_rpm" -eq 1 ] || sed -i '/<!--CATALOG-RPM-->/,/<!--\/CATALOG-RPM-->/d' /tmp/pages/index.html
          fi

          cd /tmp/pages
          git add -A
          if git diff --cached --quiet; then
            echo "repository unchanged - nothing to publish"
            exit 0
          fi
          git commit -m "repo: ${why}"
          git push origin gh-pages

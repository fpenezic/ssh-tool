<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tunnelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- macOS squircle plate: 824x824 centered on 1024 canvas (100px margin),
       flat dark slate -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#0f172a" />

  <!-- logo, original 512 viewBox. Enlarged to fill the plate for legibility
       at 16/32px. Art bbox (incl. stroke): x[70..420] y[90..422],
       visual center ~ (245,256). scale s=1.55; center on plate (512,512):
       tx = 512 - 245*1.55 = 132.25 ; ty = 512 - 256*1.55 = 115.2 -->
  <g transform="translate(132.25,115.2) scale(1.55)">
    <path d="M 140 256 C 230 256, 240 150, 360 150" fill="none" stroke="url(#tunnelGrad)" stroke-width="40" stroke-linecap="round" stroke-dasharray="8 4" />
    <path d="M 140 256 C 230 256, 240 362, 360 362" fill="none" stroke="url(#tunnelGrad)" stroke-width="40" stroke-linecap="round" stroke-dasharray="8 4" />

    <circle cx="140" cy="256" r="60" fill="#FFFFFF" stroke="#38bdf8" stroke-width="20" />
    <path d="M 125 226 L 155 256 L 125 286" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="360" cy="150" r="50" fill="#FFFFFF" stroke="#22c55e" stroke-width="16" />
    <circle cx="360" cy="150" r="16" fill="#22c55e" />

    <circle cx="360" cy="362" r="50" fill="#FFFFFF" stroke="#22c55e" stroke-width="16" />
    <circle cx="360" cy="362" r="16" fill="#22c55e" />
  </g>
</svg>

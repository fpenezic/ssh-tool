# CodeRabbit review settings. Reviews pull requests only (work on main is
# reviewed by the maintainer). Kept quiet on purpose: findings, not prose.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!frontend/bindings/**"
    - "!**/go.sum"
    - "!**/package-lock.json"
    - "!frontend/dist/**"
  path_instructions:
    - path: "**/*"
      instructions: |
        House rules of this repo - flag a change that breaks one:
        - No em-dashes or en-dashes anywhere (code, comments, docs, UI
          strings, commit text); use " - ". The middle dot (" · ") is the
          app's UI separator and is fine in UI strings.
        - No emojis in code, docs or UI; icons come from
          frontend/src/lib/iconMap.ts (lucide).
        - No sensitive data in repo files: real email addresses, internal
          hostnames or IPs, customer names, tokens. Examples use
          example.com.
        - Read-only modes (Kafka, Database) and MCP permissions must be
          enforced in the Go backend, not only hidden in the UI.
        - Platform: the app runs natively on Windows; no WSL-specific paths.
          Files without a build tag also build for android.
    - path: "**/*.go"
      instructions: |
        Look for: goroutine leaks and missing context cancellation, locks
        held across blocking calls or nested in the opposite order, errors
        dropped silently, secrets reaching logs or the audit log.
    - path: "frontend/src/**/*.svelte"
      instructions: |
        Svelte 5 runes. Look for: state mutated inside $derived or the
        template (state_unsafe_mutation), $effect loops (an effect that
        reads state it writes; loaders called from effects belong in
        untrack), `a ??= {}` on a $state proxy (yields the raw object).
    - path: "CHANGELOG.md"
      instructions: |
        Release blocks are not hard-wrapped: one line per paragraph and per
        bullet.
    - path: "docs/**/*.md"
      instructions: &docs_facts |
        Check stated facts against the repo: Go version (go.mod `go` line),
        Wails version (go.mod; also WAILS3_VERSION in
        .github/workflows/release.yml), frontend package majors
        (frontend/package.json), schema version (last entry of `migrations`
        in internal/store/migrations.go), the internal/ packages listed in
        layout trees, and that settings, menu items and file paths named in
        the text exist. Wails v3 is stable (3.0.0): flag it described as
        beta, alpha or a prerelease, except as history. CHANGELOG.md,
        docs/gotchas.md and docs/TODO.md record history and keep old
        versions.
    - path: "README.md"
      instructions: *docs_facts
    - path: "CLAUDE.md"
      instructions: *docs_facts
  pre_merge_checks:
    custom_checks:
      - name: "User-facing docs"
        mode: warning
        instructions: |
          Pass when the PR changes no user-visible behaviour (UI, settings,
          shortcuts, CLI flags, import/export formats, platform support,
          install steps), or when it does and also updates the matching
          text: docs/USER_GUIDE.md for the feature, README.md when a
          highlight, install or build step changes, and CHANGELOG.md under
          [Unreleased] or the release block. Fail and name the missing file
          when user-visible behaviour changes without them. Internal
          refactors, tests and CI-only changes pass.
chat:
  auto_reply: true
